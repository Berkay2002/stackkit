name: CI

on:
  pull_request:
  # Pushes to master run this workflow through release.yml, which publishes (manual runs only) after it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Literal prefix: a called workflow inherits the caller's github.workflow, which would share the caller's group.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test, and smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Generated FastAPI projects run through uv; the smoke step's real-toolchain test needs it.
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Real installs, builds, and Python checks of a generated project (network).
      - name: Smoke
        run: pnpm smoke
