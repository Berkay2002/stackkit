name: Native initializer canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  latest-shadcn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Materialize the Stackkit pre-initializer baseline
        shell: bash
        run: |
          node packages/cli/dist/index.js create canary --preset next-fastapi-postgres-auth0 --skills skip --dry-run > "$RUNNER_TEMP/plan.txt"
          PLAN_FILE="$RUNNER_TEMP/plan.txt" BASELINE="$RUNNER_TEMP/baseline" node - <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const output = fs.readFileSync(process.env.PLAN_FILE, "utf8");
          const json = output.split("STACKKIT_PLAN_JSON_START\n")[1].split("\nSTACKKIT_PLAN_JSON_END")[0];
          const plan = JSON.parse(json);
          for (const file of plan.filePlan.files) {
            const target = path.join(process.env.BASELINE, ...file.path.split("/"));
            fs.mkdirSync(path.dirname(target), { recursive: true });
            fs.writeFileSync(target, file.content);
          }
          JS
      - name: Compare pinned and latest on the Stackkit baseline
        id: latest
        continue-on-error: true
        shell: bash
        run: |
          cp -a "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/pinned"
          cp -a "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/latest"
          pnpm --dir "$RUNNER_TEMP/pinned" dlx shadcn@4.16.2 init -d --base radix --monorepo -t next --cwd . > "$RUNNER_TEMP/pinned.log" 2>&1
          pnpm --dir "$RUNNER_TEMP/latest" dlx shadcn@latest init -d --base radix --monorepo -t next --cwd . > "$RUNNER_TEMP/latest.log" 2>&1
          diff -ru --exclude node_modules --exclude pnpm-lock.yaml --exclude .stackkit "$RUNNER_TEMP/pinned" "$RUNNER_TEMP/latest" > "$RUNNER_TEMP/initializer.diff" || true
          if [[ -s "$RUNNER_TEMP/initializer.diff" ]]; then
            echo "The latest initializer changed generated output." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: initializer-canary
          path: |
            ${{ runner.temp }}/latest.log
            ${{ runner.temp }}/pinned.log
            ${{ runner.temp }}/initializer.diff
      - name: Open drift issue
        if: steps.latest.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Native initializer latest canary drifted",
              body: `The scheduled shadcn latest canary failed or changed generated output. Review the initializer-canary artifact from ${context.runId}. Do not update the release pin without reviewing the diff.`
            })
