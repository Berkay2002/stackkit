name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack release candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stackkit-packed"
          pnpm --dir packages/schemas pack --pack-destination "$RUNNER_TEMP/stackkit-packed"
          pnpm --dir packages/templates pack --pack-destination "$RUNNER_TEMP/stackkit-packed"
          pnpm --dir packages/registry pack --pack-destination "$RUNNER_TEMP/stackkit-packed"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/stackkit-packed"
          pnpm --dir packages/cli pack --pack-destination "$RUNNER_TEMP/stackkit-packed"

      - name: Verify packed golden project
        shell: bash
        run: |
          RC="$RUNNER_TEMP/stackkit-rc"
          PROJECT="$RUNNER_TEMP/stackkit-golden"
          mkdir -p "$RC"
          cd "$RC"
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP+"/stackkit-packed/",f=fs.readdirSync(p),pick=(name)=>"file:"+p+f.find(x=>name?x.startsWith("berkayorhan-stackkit-"+name+"-"):/^berkayorhan-stackkit-\d/.test(x));fs.writeFileSync("package.json",JSON.stringify({private:true,pnpm:{overrides:{"@berkayorhan/stackkit-schemas":pick("schemas"),"@berkayorhan/stackkit-templates":pick("templates"),"@berkayorhan/stackkit-registry":pick("registry"),"@berkayorhan/stackkit-core":pick("core")}},dependencies:{"@berkayorhan/stackkit":pick("")}},null,2))'
          pnpm install
          pnpm exec stackkit create golden-app --preset next-fastapi-postgres-auth0 --skills skip --yes --dir "$PROJECT"
          cd "$PROJECT"
          pnpm install
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm build
          STACKKIT_DOCTOR_BIN="$RC/node_modules/.bin/stackkit" pnpm stackkit:doctor
          export MOCK_AUTH_DIR="$RUNNER_TEMP/mock-auth"
          mkdir -p "$MOCK_AUTH_DIR"
          cat > "$MOCK_AUTH_DIR/mock_auth.py" <<'PY'
          import base64
          import json
          from datetime import UTC, datetime, timedelta
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import parse_qs, urlencode, urlparse

          import jwt
          from cryptography.hazmat.primitives.asymmetric import rsa

          ISSUER = "http://mock-auth:9000/"
          AUDIENCE = "https://stackkit-release-proof"
          CLIENT_ID = "stackkit-release-client"
          PRIVATE_KEY = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          PUBLIC_JWK = json.loads(jwt.algorithms.RSAAlgorithm.to_jwk(PRIVATE_KEY.public_key()))
          PUBLIC_JWK.update({"kid": "release-proof", "use": "sig", "alg": "RS256"})

          def encode_code(nonce: str) -> str:
              return base64.urlsafe_b64encode(json.dumps({"nonce": nonce}).encode()).decode().rstrip("=")

          def decode_code(code: str) -> dict[str, str]:
              return json.loads(base64.urlsafe_b64decode(code + "=" * (-len(code) % 4)))

          class Handler(BaseHTTPRequestHandler):
              def json_response(self, body: dict, status: int = 200) -> None:
                  payload = json.dumps(body).encode()
                  self.send_response(status)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def do_GET(self) -> None:
                  parsed = urlparse(self.path)
                  if parsed.path == "/.well-known/openid-configuration":
                      self.json_response({
                          "issuer": ISSUER,
                          "authorization_endpoint": "http://localhost:9000/authorize",
                          "token_endpoint": f"{ISSUER}oauth/token",
                          "userinfo_endpoint": f"{ISSUER}userinfo",
                          "jwks_uri": f"{ISSUER}jwks.json",
                          "response_types_supported": ["code"],
                          "subject_types_supported": ["public"],
                          "id_token_signing_alg_values_supported": ["RS256"],
                          "token_endpoint_auth_methods_supported": ["client_secret_post"],
                          "scopes_supported": ["openid", "profile", "email"]
                      })
                      return
                  if parsed.path == "/jwks.json":
                      self.json_response({"keys": [PUBLIC_JWK]})
                      return
                  if parsed.path == "/authorize":
                      query = parse_qs(parsed.query)
                      location = query["redirect_uri"][0] + "?" + urlencode({
                          "code": encode_code(query.get("nonce", [""])[0]),
                          "state": query["state"][0]
                      })
                      self.send_response(302)
                      self.send_header("location", location)
                      self.end_headers()
                      return
                  if parsed.path == "/userinfo":
                      self.json_response({"sub": "auth0|release-owner", "name": "Release Owner", "email": "release@example.com"})
                      return
                  self.send_error(404)

              def do_POST(self) -> None:
                  if self.path != "/oauth/token":
                      self.send_error(404)
                      return
                  body = parse_qs(self.rfile.read(int(self.headers.get("content-length", "0"))).decode())
                  nonce = decode_code(body["code"][0]).get("nonce", "")
                  now = datetime.now(UTC)
                  common = {"sub": "auth0|release-owner", "iss": ISSUER, "iat": now, "exp": now + timedelta(minutes=10)}
                  access_token = jwt.encode({**common, "aud": AUDIENCE}, PRIVATE_KEY, algorithm="RS256", headers={"kid": "release-proof"})
                  id_token = jwt.encode(
                      {**common, "aud": CLIENT_ID, "nonce": nonce, "name": "Release Owner", "email": "release@example.com"},
                      PRIVATE_KEY,
                      algorithm="RS256",
                      headers={"kid": "release-proof"}
                  )
                  self.json_response({"access_token": access_token, "id_token": id_token, "token_type": "Bearer", "expires_in": 600})

          ThreadingHTTPServer(("0.0.0.0", 9000), Handler).serve_forever()
          PY
          cat > "$RUNNER_TEMP/docker-compose.release.yml" <<'YAML'
          services:
            mock-auth:
              build:
                context: .
                dockerfile: apps/api/Dockerfile
              working_dir: /app/apps/api
              volumes:
                - ${MOCK_AUTH_DIR}:/mock:ro
              command: ["uv", "run", "python", "/mock/mock_auth.py"]
              ports:
                - "9000:9000"
            api:
              depends_on:
                mock-auth:
                  condition: service_started
            web:
              depends_on:
                mock-auth:
                  condition: service_started
              environment:
                NODE_ENV: development
              command: ["pnpm", "exec", "next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
          YAML
          export AUTH0_DOMAIN=mock-auth:9000
          export AUTH0_AUDIENCE=https://stackkit-release-proof
          export AUTH0_CLIENT_ID=stackkit-release-client
          export AUTH0_CLIENT_SECRET=stackkit-release-secret
          export AUTH0_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export AUTH0_ISSUER=http://mock-auth:9000/
          export AUTH0_JWKS_URL=http://mock-auth:9000/jwks.json
          export AUTH0_ALLOW_INSECURE_REQUESTS=true
          export BASE_COMPOSE="$PROJECT/docker-compose.yml"
          export RELEASE_COMPOSE="$RUNNER_TEMP/docker-compose.release.yml"
          trap 'docker compose -f "$BASE_COMPOSE" -f "$RELEASE_COMPOSE" down --volumes' EXIT
          docker compose -f "$BASE_COMPOSE" -f "$RELEASE_COMPOSE" up --detach --build
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/ready \
              && curl --fail --silent http://localhost:9000/.well-known/openid-configuration \
              && curl --fail --silent http://localhost:3000; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker compose -f "$BASE_COMPOSE" -f "$RELEASE_COMPOSE" logs
              exit 1
            fi
            sleep 2
          done
          BROWSER_PROOF="$RUNNER_TEMP/browser-proof"
          mkdir -p "$BROWSER_PROOF"
          cd "$BROWSER_PROOF"
          npm init --yes
          npm install --save-dev playwright@1.54.2
          npx playwright install --with-deps chromium
          node - <<'JS'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto("http://localhost:3000");
            await page.getByRole("link", { name: "Log in" }).click();
            await page.getByRole("link", { name: "Open dashboard" }).click();
            await page.getByRole("textbox", { name: "Todo title" }).fill("Release proof");
            await page.getByRole("button", { name: "Add todo" }).click();
            await page.getByText("Release proof", { exact: true }).waitFor();
            await page.getByRole("button", { name: "Complete" }).click();
            await page.getByRole("button", { name: "Reopen" }).waitFor();
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          JS

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: release stackkit packages"
          title: "chore: release stackkit packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
