name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  golden-path:
    name: Golden path
    uses: ./.github/workflows/golden-path.yml

  # Opens or updates the version PR; publishes to npm only once that PR is merged.
  # Never runs unless CI (Ubuntu and Windows) and the packed golden-path proof passed on this commit.
  release:
    name: Release
    needs: [ci, golden-path]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Setup npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish to npm
        id: changesets
        # v1 matches @changesets/cli v2; action v2 requires CLI v3.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: release stackkit packages"
          title: "chore: release stackkit packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
